# treefmt configuration for go-absolute-database
# Multi-language code formatting
#
# The Go formatters below (gofumpt + gci) are the project's single formatting
# standard. `.golangci.yml` enables the same two under `formatters:` — keep the
# two files in sync.
#
# Every formatter here runs in WRITE mode, which is how treefmt works. Do not
# invoke treefmt directly for a "check": use `just check-formatted`, which runs
# it against a scratch copy so the working tree is never modified.

[global]
excludes = [
    # Git and version control
    "**/.gitignore",
    "**/.git/**",

    # Go module files (managed by go tooling)
    "go.sum",
    "go.mod",

    # Documentation and text files
    "**/*.txt",
    "CHANGELOG.md",
    "LICENSE",

    # Binary and data files
    "**/*.abs",
    "**/*.exe",
    "**/*.dll",
    "**/*.pdf",
    "**/*.png",
    "**/*.jpg",
    "**/*.jpeg",

    # Build artifacts
    "bin/**",
    "dist/**",
    "coverage.out",
    "coverage.html",

    # Safety net only. The ComponentAce SDK lives outside the repository (see
    # docs/provenance.md); this keeps it excluded if anyone extracts one here.
    "legacy/**",
]

# Go formatter - simple and strict
[formatter.gofumpt]
command = "gofumpt"
options = ["-w"]
includes = ["*.go"]

# Go import organizer - runs after gofumpt
[formatter.gci]
command = "gci"
options = ["write"]
includes = ["*.go"]
priority = 1

# Shell script checker
[formatter.shellcheck]
command = "shellcheck"
includes = ["*.sh"]

# Shell script formatter - runs after shellcheck
[formatter.shfmt]
command = "shfmt"
options = ["-s", "-w"]
includes = ["*.sh"]
priority = 1

# Markdown, YAML, JSON formatter
[formatter.prettier]
command = "prettier"
options = ["-w"]
includes = [
    "*.md",
    "*.yaml",
    "*.yml",
    "*.json",
]
excludes = [
    # Exclude potentially sensitive or auto-generated files
    "**/*.sops.*",
]
